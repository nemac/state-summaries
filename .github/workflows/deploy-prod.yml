name: Deploy to production (S3 + CloudFront)

# Fires on any push to `master`. Also runnable on demand from the Actions tab.
# This is a Vite app, so the runner builds first (npm ci + npm run build) and
# then syncs the generated `dist/` directory to S3 and invalidates CloudFront.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two prod deploys overlap. A push that arrives mid-deploy waits.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Required for GitHub OIDC: `id-token: write` lets the runner request a token
# to assume the AWS role. No long-lived AWS keys are stored in this repo.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::104538610210:role/state-summaries-github-actions-prod
  S3_BUCKET: state-summaries.nemac.org
  CF_DISTRIBUTION_ID: E1O8E6EWX3V9PR

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The `production` environment is what the IAM role's trust policy is
    # scoped to (sub = repo:nemac/state-summaries:environment:production).
    # It also gives you a place to add approval gates later without editing
    # this file (Settings → Environments → production).
    environment:
      name: production
      url: https://state-summaries.nemac.org

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The manifest build crops the white padding off the CONUS maps with
      # ImageMagick. If it were ever missing the build falls back to untrimmed
      # images, but we install it so production always gets the cropped maps.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # Unit tests (manifest-normalization logic). A failure fails the deploy.
      - name: Run tests
        run: npm test

      # Regenerate the precipitation map manifest from INDEX.csv. Called out as
      # its own step so a data/parse problem shows up here rather than being
      # buried in the build. (`npm run build` also runs this via `prebuild`;
      # the second run is idempotent.)
      - name: Generate precipitation map manifest
        run: npm run build:precip-manifest

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Sync the build output to the bucket. `--delete` removes files from the
      # bucket that are no longer produced by the build. The excludes keep the
      # heavy map source files (Illustrator .ai / ArcGIS .aix) and macOS junk
      # out of the public bucket — only the JPG previews the app uses are served.
      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}" --delete \
            --exclude "*.ai" \
            --exclude "*.aix" \
            --exclude "*.pdf" \
            --exclude "*.DS_Store"

      - name: Invalidate CloudFront
        id: invalidate
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "invalidation_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Created invalidation $ID for /*"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy summary"
            echo "- Bucket: \`s3://${S3_BUCKET}\`"
            echo "- CloudFront: \`${CF_DISTRIBUTION_ID}\` (invalidation \`${{ steps.invalidate.outputs.invalidation_id }}\`)"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
