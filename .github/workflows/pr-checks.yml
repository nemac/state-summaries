name: PR checks

# Runs the tests (including the data-integrity checks over public/sandboxdata)
# and a production build on every pull request, so problems surface before merge.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and data checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The tests never import the React components, so only a build catches JSX errors.
      - name: Build
        run: npm run build
